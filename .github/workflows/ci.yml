name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Allow Dependabot to run this workflow
permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Python for FastAPI backend
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Setup Node.js for TypeScript components
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      # Install Node.js dependencies
      - name: Install Node.js dependencies
        run: |
          npm install
          npm install express @aws-sdk/client-dynamodb @aws-sdk/lib-dynamodb
          npm install --save-dev @types/node @types/express @types/aws-lambda

      # Run Python tests with coverage
      - name: Run Python tests
        id: pytest
        env:
          GEN_AI_STUDIO_API_KEY: ${{ secrets.GEN_AI_STUDIO_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pytest tests/ -v --cov=src --cov-report=term --cov-report=xml
        continue-on-error: true

      # Build TypeScript
      - name: Build TypeScript
        run: npm run build

      # Run Node.js tests
      - name: Run Node.js tests
        id: jest
        run: npm test
        continue-on-error: true

      # Upload coverage reports
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      # CI Test Summary (non-blocking)
      - name: CI Test Summary
        if: always()
        run: |
          {
            echo "## CI Test Summary"
            echo ""
            echo "- Pytest: **${{ steps.pytest.outcome }}**"
            echo "- Jest: **${{ steps.jest.outcome }}**"
            echo ""
            if [ "${{ steps.pytest.outcome }}" != "success" ] || [ "${{ steps.jest.outcome }}" != "success" ]; then
              echo "⚠️ One or more test steps failed, but failures are **non-blocking** in this pipeline."
              echo "Check the logs above for details."
            else
              echo "✅ All test steps passed."
            fi
          } >> $GITHUB_STEP_SUMMARY

  # Auto-merge Dependabot PRs for minor/patch updates when tests pass
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.actor == 'dependabot[bot]'
    
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      
      - name: Auto-merge minor and patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
